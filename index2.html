<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>서원이 생일 초대장</title>

<style>
:root{
  --pink:#ff4d6d;
  --ink:#1d1d1f;
  --sub:#6e6e73;
  --ease:cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; height:100%; }
button { -webkit-appearance: none; appearance: none; font: inherit; }

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:flex-end;            /* 글자와 버튼은 화면 아래쪽에 */
  padding:
    max(24px, env(safe-area-inset-top))
    max(20px, env(safe-area-inset-right))
    calc(max(24px, env(safe-area-inset-bottom)) + 5vh)
    max(20px, env(safe-area-inset-left));
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  background:#000;
  color:#fff;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ===== 배경: 사진 위쪽이 잘리지 않게 맨 위에 맞춤, 두 장이 부드럽게 교차 ===== */
.bg{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  z-index:0;
  transition:opacity 1.6s ease;
}
.bg1{ background-image:url("01.jpg"); }
.bg2{ background-image:url("02.jpg"); opacity:0; }
body.final .bg2{ opacity:1; }

/* 사진 위 어두운 막: 아래로 갈수록 진하게 */
.shade{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 68%, rgba(0,0,0,.85) 100%);
}

/* ===== 카드 상자 없이, 글자와 버튼이 사진 위에 바로 놓임 ===== */
.card{
  width:100%;
  max-width:420px;
  padding:20px 16px 0;
  text-align:center;
  position:relative;
  z-index:10;
  color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,.35);
}

/* 라벨 → 제목 → 버튼 순서로 차례차례 떠오름 */
.eyebrow, h1, .btn-container{ animation:up 1.1s var(--ease) both; }
.eyebrow{ animation-delay:.15s; }
h1{ animation-delay:.3s; }
.btn-container{ animation-delay:.5s; }

@keyframes up{
  from{ opacity:0; translate:0 26px; }
  to  { opacity:1; translate:0 0; }
}

.eyebrow{
  margin:0 0 10px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--pink);
  text-shadow:0 1px 10px rgba(0,0,0,.5);
}

h1{
  font-size:34px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.03em;
  margin:0 0 30px;
  word-break:keep-all;
}

.btn-container{
  position:relative;
  width:100%;
  max-width:280px;
  height:56px;
  margin:0 auto;
  touch-action: manipulation;
}

.btn{
  position:absolute;
  top:0;
  width:min(120px, 46%);
  height:50px;
  border:none;
  border-radius:980px;
  font-size:17px;
  font-weight:600;
  letter-spacing:-.01em;
  text-shadow:none;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action: manipulation;
  z-index:20;
  pointer-events:auto;
  transition:
    transform .45s var(--ease),
    left .35s var(--ease),
    top .35s var(--ease),
    background .4s ease,
    color .4s ease;
}

.btn:active{ transform:scale(.96); }

/* 분홍은 Yes 한 곳에만, No는 사진이 비치는 흰 유리 */
.yes{
  left:0;
  background:var(--pink);
  color:#fff;
  box-shadow:0 10px 30px rgba(255,77,109,.38);
}
.no{
  left:calc(100% - min(120px, 46%));
  background:rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}

/* No 버튼 기믹 */
.plea{
  min-height:22px;
  margin:16px 0 0;
  font-size:15px;
  font-weight:500;
  letter-spacing:-.01em;
  color:rgba(255,255,255,.86);
}

.card.shake{ animation: shake .45s ease; }

@keyframes shake{
  0%,100%{ translate:0 0; }
  20%{ translate:-10px 0; }
  40%{ translate:10px 0; }
  60%{ translate:-6px 0; }
  80%{ translate:6px 0; }
}

/* 눈물 대신 가늘게 떨어지는 빗줄기 */
.tear{
  position:fixed;
  top:-60px;
  width:2px;
  height:34px;
  border-radius:2px;
  background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.75));
  pointer-events:none;
  animation: fall 1.5s cubic-bezier(.4,0,1,1) forwards;
  z-index:5;
}

@keyframes fall{
  100%{ transform:translateY(120vh); opacity:.15; }
}

.result{
  margin-top:18px;
  font-size:28px;
  line-height:1.3;
  font-weight:700;
  letter-spacing:-.03em;
  display:none;
  word-break:keep-all;
}
.result i{ font-style:normal; color:var(--pink); font-size:.7em; vertical-align:.12em; margin:0 .25em; }

/* 은은하게 떠오르는 분홍·흰 하트 */
.heart{
  position:fixed;
  pointer-events:none;
  line-height:1;
  text-shadow:0 0 18px rgba(255,77,109,.45);
  animation: float 4.2s var(--ease) forwards;
  z-index:5;
}

@keyframes float{
  0%  { transform:translateY(0) scale(.6); opacity:0; }
  15% { opacity:var(--o, .9); }
  100%{ transform:translateY(-78vh) scale(1.15); opacity:0; }
}

/* 영상 전체 화면: 부드럽게 나타나고 사라짐 */
#birthdayVideo {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  z-index: 1000;
  opacity:0;
  transition:opacity .7s ease;
}
#birthdayVideo.show{ opacity:1; }

/* 처음으로 돌아가기 버튼 */
.restart-btn{
  display:none;
  margin:18px auto 0;
  padding:11px 22px;
  border:none;
  border-radius:980px;
  background:rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  text-shadow:none;
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .3s var(--ease), background .3s ease;
}
.restart-btn:active{ transform:scale(.96); background:rgba(255,255,255,.28); }

/* 마지막 화면 카드 */
.card.final-screen{
  position:fixed;
  left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  width:calc(100% - 40px);
  max-width:420px;
  padding:0 12px;
  transform:translateX(-50%);
  animation:rise 1.2s var(--ease) both;
}

@keyframes rise{
  from{ opacity:0; translate:0 60px; }
  to  { opacity:1; translate:0 0; }
}

/* 마지막 화면에서는 처음 질문과 Yes/No 숨기기 */
.card.final-screen .eyebrow,
.card.final-screen h1,
.card.final-screen .btn-container,
.card.final-screen .plea{
  display:none;
}

/* 마지막 화면 문구 */
.card.final-screen .result{
  display:block;
  margin:0;
}

/* 마지막 화면 돌아가기 버튼 */
.card.final-screen .restart-btn{
  display:block;
}

/* 움직임 줄이기 설정을 켠 사람에게는 효과 최소화 */
@media (prefers-reduced-motion: reduce){
  .card.final-screen, .eyebrow, h1, .btn-container{ animation:none; }
}

</style>
</head>

<body>
  <div class="bg bg1"></div>
  <div class="bg bg2"></div>
  <div class="shade"></div>

  <div class="card" id="card">
    <p class="eyebrow">Birthday Invitation</p>
    <h1 id="question">
      서원이 생일인데 올래?
    </h1>

    <div class="btn-container" id="btnArea">
      <button class="btn yes" id="yesBtn" type="button">Yes</button>
      <button class="btn no" id="noBtn" type="button">No</button>
    </div>

    <div class="plea" id="plea"></div>

    <div class="result" id="result"><i>&#9829;&#xFE0E;</i>뚱깨 생일 참석 확정<i>&#9829;&#xFE0E;</i></div>

    <button class="restart-btn" id="restartBtn" type="button">
      처음으로 돌아가기
    </button>
  </div>

<!-- 생일 영상 -->
<video id="birthdayVideo" playsinline webkit-playsinline preload="auto">
  <source src="birthday.mp4" type="video/mp4">
</video>

<script>
(function () {
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const btnArea = document.getElementById("btnArea");
  const result = document.getElementById("result");
  const video = document.getElementById("birthdayVideo");
  const plea = document.getElementById("plea");
  const card = document.getElementById("card");
  const restartBtn = document.getElementById("restartBtn");

  if (!yesBtn || !noBtn || !btnArea || !video) return;

  /* 영상 재생 */
  async function startVideo() {
    video.style.display = "block";
    void video.offsetWidth;          /* 페이드 인이 걸리도록 한 번 그리기 */
    video.classList.add("show");

    try {
      video.currentTime = 0;
      await video.play();
    } catch (error) {
      video.classList.remove("show");
      video.style.display = "none";
      console.log("영상 재생 오류:", error);
    }
  }

  yesBtn.addEventListener("click", startVideo);

  /* 영상 종료 후 마지막 화면 */
  video.addEventListener("ended", () => {
    /* 영상은 서서히 사라지고, 그 뒤로 두 번째 사진이 드러남 */
    video.classList.remove("show");
    setTimeout(() => {
      if (!video.classList.contains("show")) video.style.display = "none";
    }, 700);

    document.body.classList.add("final");

    card.classList.add("final-screen");

    result.style.display = "block";

    createHearts();
  });

  /* 하트 효과 */
  function createHearts(){
    for(let i=0;i<26;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.textContent="\u2665\uFE0E";
      h.style.left = (Math.random()*window.innerWidth) + "px";
      h.style.top = window.innerHeight + "px";
      h.style.fontSize = (14 + Math.random()*24) + "px";
      h.style.color = Math.random() < .6 ? "#ff4d6d" : "#fff";
      h.style.setProperty("--o", (.45 + Math.random()*.5).toFixed(2));
      h.style.animationDelay = (Math.random()*1.4) + "s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 6000);
    }
  }

  /* ===== No 버튼 기믹 ===== */
  const pleas = [
    "어? 잘못 누른 거죠? 🤔",
    "다시 한번 생각해 봐… 🥺",
    "서원이 울어요 😢",
    "케이크도 있는데?! 🎂",
    "진짜 안 올 거야…? 💔",
    "No 버튼이 지쳤어요 😵",
    "이제 선택지는 하나뿐 😎"
  ];

  const noLabels = ["No?", "진짜?", "정말로?", "음…", "…", "😵", "Yes!"];

  let tries = 0;
  let lastTry = 0;
  let surrendered = false;

  function overlaps(a, b, gap){
    return !(a.right + gap < b.left || a.left - gap > b.right ||
             a.bottom + gap < b.top || a.top - gap > b.bottom);
  }

  function moveNo(){
    const area = btnArea.getBoundingClientRect();
    const box  = card.getBoundingClientRect();
    const yes  = yesBtn.getBoundingClientRect();

    const w = noBtn.offsetWidth || 120;
    const h = noBtn.offsetHeight || 48;
    const pad = 10;

    let x = btnArea.clientWidth - w;
    let y = 0;

    for (let i = 0; i < 40; i++){
      const px = box.left + pad + Math.random() * (box.width - w - pad*2);
      const py = box.top + pad + Math.random() * (box.height - h - pad*2);

      const r = {
        left:px,
        top:py,
        right:px + w,
        bottom:py + h
      };

      x = px - area.left;
      y = py - area.top;

      if (!overlaps(r, yes, 12)) break;
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  function rainTears(){
    for (let i = 0; i < 22; i++){
      const t = document.createElement("div");
      t.className = "tear";
      t.style.height = (22 + Math.random() * 30) + "px";
      t.style.left = (Math.random() * window.innerWidth) + "px";
      t.style.animationDelay = (Math.random() * .6) + "s";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
  }

  function dodge(e){
    if (surrendered) return;
    if (e) e.preventDefault();

    const now = Date.now();
    if (now - lastTry < 250) return;
    lastTry = now;

    const step = Math.min(tries, pleas.length - 1);
    tries++;

    plea.textContent = pleas[step];
    noBtn.textContent = noLabels[step];

    yesBtn.style.transform =
      "scale(" + Math.min(1 + tries * 0.07, 1.4) + ")";

    noBtn.style.transform =
      "scale(" + Math.max(1 - tries * 0.08, 0.55) + ")";

    if (tries >= 3){
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      rainTears();
    }

    if (step === pleas.length - 1){
      surrendered = true;

      noBtn.style.background = "#ff4d6d";
      noBtn.style.borderColor = "transparent";
      noBtn.style.color = "#fff";
      noBtn.style.transform = "scale(1)";
      yesBtn.style.transform = "scale(1)";

      noBtn.style.left = "";
      noBtn.style.top = "";

      return;
    }

    moveNo();
  }

  /* PC: 올리면 도망 */
  noBtn.addEventListener("mouseenter", dodge);

  /* 모바일: 누르려는 순간 도망 */
  noBtn.addEventListener("touchstart", dodge, { passive:false });

  /* 클릭 */
  noBtn.addEventListener("click", (e) => {
    if (surrendered) {
      startVideo();
      return;
    }

    dodge(e);
  });

  /* ===== 처음으로 돌아가기 ===== */
  restartBtn.addEventListener("click", () => {

    /* 영상 정지 및 초기화 */
    video.pause();
    video.currentTime = 0;
    video.classList.remove("show");
    video.style.display = "none";

    /* 배경 원래대로 복구 */
    document.body.classList.remove("final");

    /* 마지막 화면 해제 */
    card.classList.remove("final-screen");
    card.classList.remove("shake");

    /* 문구 초기화 */
    result.style.display = "none";
    plea.textContent = "";

    /* 버튼 표시 복구 */
    yesBtn.style.display = "";
    noBtn.style.display = "";

    /* 버튼 위치 및 크기 초기화 */
    yesBtn.style.transform = "";
    noBtn.style.transform = "";
    noBtn.style.left = "";
    noBtn.style.top = "";

    /* No 버튼 디자인 초기화 */
    noBtn.textContent = "No";
    noBtn.style.background = "";
    noBtn.style.borderColor = "";
    noBtn.style.color = "";

    /* No 버튼 기믹 횟수 초기화 */
    tries = 0;
    lastTry = 0;
    surrendered = false;

    /* 기존에 남아 있는 하트와 눈물 제거 */
    document.querySelectorAll(".heart, .tear").forEach(el => el.remove());
  });

})();
</script>
</body>
</html>
