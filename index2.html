
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>서원이 생일 초대장</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; height:100%; }
button { -webkit-appearance: none; appearance: none; font: inherit; }

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:
    max(24px, env(safe-area-inset-top))
    max(20px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(20px, env(safe-area-inset-left));
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;

  background-image:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url("01.jpg");
  background-size:cover;
  background-color:#222;
  background-position:center, center calc(50% - 100px);
  background-repeat:no-repeat;
  transition: background-image .5s ease;

  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  border-radius:20px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  position:relative;
  z-index:10;
  transform: translateY(min(120px, 14vh));
}

h1{
  font-size:20px;
  line-height:1.6;
  margin:0 0 24px;
}

.btn-container{
  position:relative;
  width:100%;
  max-width:280px;
  height:56px;
  margin:0 auto;
  touch-action: manipulation;
}

.btn{
  position:absolute;
  top:0;
  width:min(120px, 46%);
  height:48px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action: manipulation;
  z-index:20;
  pointer-events:auto;
  transition: transform .25s ease, left .18s ease, top .18s ease, background .3s ease;
}

.btn:active{ transform:scale(.98); }

.yes{ left:0; background:#ff4d6d; color:#fff; }
.no { left:calc(100% - min(120px, 46%)); background:#d6d6d6; color:#111; }

/* No 버튼 기믹 */
.plea{
  min-height:24px;
  margin:14px 0 0;
  font-size:15px;
  font-weight:700;
  color:#ff4d6d;
}

.card.shake{ animation: shake .4s ease; }

@keyframes shake{
  0%,100%{ translate:0 0; }
  20%{ translate:-10px 0; }
  40%{ translate:10px 0; }
  60%{ translate:-6px 0; }
  80%{ translate:6px 0; }
}

.tear{
  position:fixed;
  top:-40px;
  font-size:28px;
  pointer-events:none;
  animation: fall 2.2s linear forwards;
  z-index:5;
}

@keyframes fall{
  100%{ transform:translateY(110vh) rotate(40deg); opacity:.2; }
}

.result{
  margin-top:18px;
  font-size:20px;
  font-weight:700;
  color:#ff4d6d;
  display:none;
}

.heart{
  position:fixed;
  pointer-events:none;
  animation: float 2.8s linear forwards;
  z-index:5;
}

@keyframes float{
  0%{ transform:translateY(0); opacity:1; }
  100%{ transform:translateY(-300px); opacity:0; }
}

/* 영상 전체 화면 */
#birthdayVideo {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  z-index: 1000;
}

/* 처음으로 돌아가기 버튼 */
.restart-btn{
  display:none;
  margin:18px auto 0;
  padding:12px 24px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
}

/* 마지막 화면 카드 */
.card.final-screen{
  position:fixed;
  left:50%;
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:calc(100% - 40px);
  max-width:420px;
  padding:20px 18px;
  transform:translateX(-50%);
}

/* 마지막 화면에서는 처음 질문과 Yes/No 숨기기 */
.card.final-screen h1,
.card.final-screen .btn-container,
.card.final-screen .plea{
  display:none;
}

/* 마지막 화면 문구 */
.card.final-screen .result{
  display:block;
  margin:0;
}

/* 마지막 화면 돌아가기 버튼 */
.card.final-screen .restart-btn{
  display:block;
}

</style>
</head>

<body>
  <div class="card" id="card">
    <h1 id="question">
      서원이 생일인데 올래?
    </h1>

    <div class="btn-container" id="btnArea">
      <button class="btn yes" id="yesBtn" type="button">Yes</button>
      <button class="btn no" id="noBtn" type="button">No</button>
    </div>

    <div class="plea" id="plea"></div>

    <div class="result" id="result">❤️ 뚱깨 생일 참석 확정 ❤️</div>

    <button class="restart-btn" id="restartBtn" type="button">
      처음으로 돌아가기
    </button>
  </div>

<!-- 생일 영상 -->
<video id="birthdayVideo" playsinline webkit-playsinline preload="auto">
  <source src="birthday.mp4" type="video/mp4">
</video>

<script>
(function () {
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const btnArea = document.getElementById("btnArea");
  const result = document.getElementById("result");
  const video = document.getElementById("birthdayVideo");
  const plea = document.getElementById("plea");
  const card = document.getElementById("card");
  const restartBtn = document.getElementById("restartBtn");

  if (!yesBtn || !noBtn || !btnArea || !video) return;

  /* 영상 재생 */
  async function startVideo() {
    video.style.display = "block";

    try {
      video.currentTime = 0;
      await video.play();
    } catch (error) {
      video.style.display = "none";
      console.log("영상 재생 오류:", error);
    }
  }

  yesBtn.addEventListener("click", startVideo);

  /* 영상 종료 후 마지막 화면 */
  video.addEventListener("ended", () => {
    video.style.display = "none";

    document.body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url("02.jpg")';

    card.classList.add("final-screen");

    result.style.display = "block";

    createHearts();
  });

  /* 하트 효과 */
  function createHearts(){
    for(let i=0;i<20;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.textContent="❤️";
      h.style.left = (Math.random()*window.innerWidth) + "px";
      h.style.top = window.innerHeight + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 2800);
    }
  }

  /* ===== No 버튼 기믹 ===== */
  const pleas = [
    "어? 잘못 누른 거죠? 🤔",
    "다시 한번 생각해 봐… 🥺",
    "서원이 울어요 😢",
    "케이크도 있는데?! 🎂",
    "진짜 안 올 거야…? 💔",
    "No 버튼이 지쳤어요 😵",
    "이제 선택지는 하나뿐 😎"
  ];

  const noLabels = ["No?", "진짜?", "정말로?", "음…", "…", "😵", "Yes!"];

  let tries = 0;
  let lastTry = 0;
  let surrendered = false;

  function overlaps(a, b, gap){
    return !(a.right + gap < b.left || a.left - gap > b.right ||
             a.bottom + gap < b.top || a.top - gap > b.bottom);
  }

  function moveNo(){
    const area = btnArea.getBoundingClientRect();
    const box  = card.getBoundingClientRect();
    const yes  = yesBtn.getBoundingClientRect();

    const w = noBtn.offsetWidth || 120;
    const h = noBtn.offsetHeight || 48;
    const pad = 10;

    let x = btnArea.clientWidth - w;
    let y = 0;

    for (let i = 0; i < 40; i++){
      const px = box.left + pad + Math.random() * (box.width - w - pad*2);
      const py = box.top + pad + Math.random() * (box.height - h - pad*2);

      const r = {
        left:px,
        top:py,
        right:px + w,
        bottom:py + h
      };

      x = px - area.left;
      y = py - area.top;

      if (!overlaps(r, yes, 12)) break;
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  function rainTears(){
    for (let i = 0; i < 14; i++){
      const t = document.createElement("div");
      t.className = "tear";
      t.textContent = Math.random() < .5 ? "😢" : "😭";
      t.style.left = (Math.random() * window.innerWidth) + "px";
      t.style.animationDelay = (Math.random() * .6) + "s";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
  }

  function dodge(e){
    if (surrendered) return;
    if (e) e.preventDefault();

    const now = Date.now();
    if (now - lastTry < 250) return;
    lastTry = now;

    const step = Math.min(tries, pleas.length - 1);
    tries++;

    plea.textContent = pleas[step];
    noBtn.textContent = noLabels[step];

    yesBtn.style.transform =
      "scale(" + Math.min(1 + tries * 0.07, 1.4) + ")";

    noBtn.style.transform =
      "scale(" + Math.max(1 - tries * 0.08, 0.55) + ")";

    if (tries >= 3){
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      rainTears();
    }

    if (step === pleas.length - 1){
      surrendered = true;

      noBtn.style.background = "#ff4d6d";
      noBtn.style.color = "#fff";
      noBtn.style.transform = "scale(1)";
      yesBtn.style.transform = "scale(1)";

      noBtn.style.left = "";
      noBtn.style.top = "";

      return;
    }

    moveNo();
  }

  /* PC: 올리면 도망 */
  noBtn.addEventListener("mouseenter", dodge);

  /* 모바일: 누르려는 순간 도망 */
  noBtn.addEventListener("touchstart", dodge, { passive:false });

  /* 클릭 */
  noBtn.addEventListener("click", (e) => {
    if (surrendered) {
      startVideo();
      return;
    }

    dodge(e);
  });

  /* ===== 처음으로 돌아가기 ===== */
  restartBtn.addEventListener("click", () => {

    /* 영상 정지 및 초기화 */
    video.pause();
    video.currentTime = 0;
    video.style.display = "none";

    /* 배경 원래대로 복구 */
    document.body.style.backgroundImage = "";

    /* 마지막 화면 해제 */
    card.classList.remove("final-screen");
    card.classList.remove("shake");

    /* 문구 초기화 */
    result.style.display = "none";
    plea.textContent = "";

    /* 버튼 표시 복구 */
    yesBtn.style.display = "";
    noBtn.style.display = "";

    /* 버튼 위치 및 크기 초기화 */
    yesBtn.style.transform = "";
    noBtn.style.transform = "";
    noBtn.style.left = "";
    noBtn.style.top = "";

    /* No 버튼 디자인 초기화 */
    noBtn.textContent = "No";
    noBtn.style.background = "";
    noBtn.style.color = "";

    /* No 버튼 기믹 횟수 초기화 */
    tries = 0;
    lastTry = 0;
    surrendered = false;

    /* 기존에 남아 있는 하트와 눈물 제거 */
    document.querySelectorAll(".heart, .tear").forEach(el => el.remove());
  });

})();
</script>
</body>
</html>
