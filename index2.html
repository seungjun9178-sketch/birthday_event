<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>서원이 생일 초대장</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; height:100%; }
button { -webkit-appearance: none; appearance: none; font: inherit; }

body{
  margin:0;
  /* 아이폰: 주소창 높이 변화와 노치/홈바 영역 대응 */
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:
    max(24px, env(safe-area-inset-top))
    max(20px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(20px, env(safe-area-inset-left));
  overflow:hidden;
  overscroll-behavior:none;      /* 당겨서 튕기는 스크롤 방지 */
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;    /* 길게 눌러도 메뉴 안 뜨게 */

  background-image:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url("01.jpg");
  background-size:cover;
  background-color:#222;
  /* 어두운 막은 화면 전체, 사진만 100px 위로 */
  background-position:center, center calc(50% - 100px);
  background-repeat:no-repeat;
  transition: background-image .5s ease;

  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  border-radius:20px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  position:relative;
  z-index:10; /* ✅ 클릭 안 막히게 */
  transform: translateY(min(120px, 14vh));
}

h1{
  font-size:20px;
  line-height:1.6;
  margin:0 0 24px;
}

.btn-container{
  position:relative;
  width:100%;
  max-width:280px;
  height:56px;
  margin:0 auto;
  touch-action: manipulation; /* ✅ 모바일 탭 반응 개선 */
}

.btn{
  position:absolute;
  top:0;
  width:min(120px, 46%);   /* 작은 아이폰에서도 두 버튼이 안 겹치게 */
  height:48px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action: manipulation;   /* 더블탭 확대 방지 */
  z-index:20;            /* ✅ 클릭 안 막히게 */
  pointer-events:auto;   /* ✅ 클릭 안 막히게 */
  transition: transform .25s ease, left .18s ease, top .18s ease, background .3s ease;
}

.btn:active{ transform:scale(.98); }

.yes{ left:0; background:#ff4d6d; color:#fff; }
.no { left:calc(100% - min(120px, 46%)); background:#d6d6d6; color:#111; }

/* No 버튼 기믹 */
.plea{
  min-height:24px;
  margin:14px 0 0;
  font-size:15px;
  font-weight:700;
  color:#ff4d6d;
}
.card.shake{ animation: shake .4s ease; }
@keyframes shake{
  0%,100%{ translate:0 0; }
  20%{ translate:-10px 0; }
  40%{ translate:10px 0; }
  60%{ translate:-6px 0; }
  80%{ translate:6px 0; }
}
.tear{
  position:fixed;
  top:-40px;
  font-size:28px;
  pointer-events:none;
  animation: fall 2.2s linear forwards;
  z-index:5;
}
@keyframes fall{
  100%{ transform:translateY(110vh) rotate(40deg); opacity:.2; }
}

.result{
  margin-top:18px;
  font-size:20px;
  font-weight:700;
  color:#ff4d6d;
  display:none;
}

.heart{
  position:fixed;
  pointer-events:none;
  animation: float 2.8s linear forwards;
  z-index:5;
}

@keyframes float{
  0%{ transform:translateY(0); opacity:1; }
  100%{ transform:translateY(-300px); opacity:0; }
}

/* 영상 전체 화면 */
#birthdayVideo {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  z-index: 1000;
}

</style>
</head>

<body>
  <div class="card">
    <h1>
      서원이 생일인데 올래?
    </h1>

    <div class="btn-container" id="btnArea">
      <button class="btn yes" id="yesBtn" type="button">Yes</button>
      <button class="btn no" id="noBtn" type="button">No</button>
    </div>

    <div class="plea" id="plea"></div>

    <div class="result" id="result">❤️ 뚱깨 생일 참석 확정 ❤️</div>
  </div>

<!-- 생일 영상 -->
<video id="birthdayVideo" playsinline webkit-playsinline preload="auto">
  <source src="birthday.mp4" type="video/mp4">
</video>

<script>
(function () {
  const yesBtn = document.getElementById("yesBtn") || document.querySelector(".yes");
  const noBtn  = document.getElementById("noBtn")  || document.querySelector(".no");
  const btnArea = document.getElementById("btnArea") || document.querySelector(".btn-container");
  const result = document.getElementById("result");

  if (!yesBtn || !noBtn || !btnArea) {
    // 요소가 없으면(복붙 실수) 그냥 종료
    return;
  }

  const video = document.getElementById("birthdayVideo");

  async function startVideo() {
    video.style.display = "block";

    try {
      video.currentTime = 0;
      await video.play();
    } catch (error) {
      video.style.display = "none";
      console.log("영상 재생 오류:", error);
    }
  }

  yesBtn.addEventListener("click", startVideo);

  video.addEventListener("ended", () => {
    video.style.display = "none";

    document.body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url("02.jpg")';

    if (result) result.style.display = "block";

    createHearts();
  });

  function createHearts(){
    for(let i=0;i<20;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.textContent="❤️";
      h.style.left = (Math.random()*window.innerWidth) + "px";
      h.style.top  = window.innerHeight + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 2800);
    }
  }

  /* ===== No 버튼 기믹 =====
     누를수록 단계가 올라감:
     1) 도망가면서 문구가 바뀜
     2) Yes는 점점 커지고 No는 점점 작아짐
     3) 3번째부터 카드가 흔들리고 눈물 이모지가 떨어짐
     4) 마지막엔 No가 Yes로 변해서 뭘 눌러도 참석 */
  const plea = document.getElementById("plea");
  const card = document.querySelector(".card");
  const pleas = [
    "어? 잘못 누른 거죠? 🤔",
    "다시 한번 생각해 봐… 🥺",
    "서원이 울어요 😢",
    "케이크도 있는데?! 🎂",
    "진짜 안 올 거야…? 💔",
    "No 버튼이 지쳤어요 😵",
    "이제 선택지는 하나뿐 😎"
  ];
  const noLabels = ["No?", "진짜?", "정말로?", "음…", "…", "😵", "Yes!"];
  let tries = 0;
  let lastTry = 0;
  let surrendered = false;

  function overlaps(a, b, gap){
    return !(a.right + gap < b.left || a.left - gap > b.right ||
             a.bottom + gap < b.top || a.top - gap > b.bottom);
  }

  // 카드 안에서 도망가되 Yes 버튼은 절대 가리지 않음
  function moveNo(){
    const area = btnArea.getBoundingClientRect();
    const box  = card.getBoundingClientRect();
    const yes  = yesBtn.getBoundingClientRect();
    const w = noBtn.offsetWidth || 120;
    const h = noBtn.offsetHeight || 48;
    const pad = 10;
    let x = btnArea.clientWidth - w, y = 0;

    for (let i = 0; i < 40; i++){
      const px = box.left + pad + Math.random() * (box.width  - w - pad*2);
      const py = box.top  + pad + Math.random() * (box.height - h - pad*2);
      const r = { left:px, top:py, right:px + w, bottom:py + h };
      x = px - area.left;
      y = py - area.top;
      if (!overlaps(r, yes, 12)) break;
    }

    noBtn.style.left = x + "px";
    noBtn.style.top  = y + "px";
  }

  function rainTears(){
    for (let i = 0; i < 14; i++){
      const t = document.createElement("div");
      t.className = "tear";
      t.textContent = Math.random() < .5 ? "😢" : "😭";
      t.style.left = (Math.random() * window.innerWidth) + "px";
      t.style.animationDelay = (Math.random() * .6) + "s";
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
  }

  function dodge(e){
    if (surrendered) return;          // 항복 후에는 그냥 Yes로 동작
    if (e) e.preventDefault();

    const now = Date.now();           // 터치 한 번에 이벤트가 겹쳐도 1회만 처리
    if (now - lastTry < 250) return;
    lastTry = now;

    const step = Math.min(tries, pleas.length - 1);
    tries++;

    plea.textContent = pleas[step];
    noBtn.textContent = noLabels[step];

    // Yes는 커지고 No는 작아짐
    yesBtn.style.transform = "scale(" + Math.min(1 + tries * 0.07, 1.4) + ")";
    noBtn.style.transform  = "scale(" + Math.max(1 - tries * 0.08, 0.55) + ")";

    if (tries >= 3){
      card.classList.remove("shake");
      void card.offsetWidth;          // 애니메이션 다시 시작
      card.classList.add("shake");
      rainTears();
    }

    if (step === pleas.length - 1){
      // 마지막 단계: No가 Yes로 변신
      surrendered = true;
      noBtn.style.background = "#ff4d6d";
      noBtn.style.color = "#fff";
      noBtn.style.transform = "scale(1)";
      yesBtn.style.transform = "scale(1)";
      noBtn.style.left = "";   // 원래 자리로
      noBtn.style.top = "";
      return;
    }

    moveNo();
  }

  // PC: 올리면 도망
  noBtn.addEventListener("mouseenter", dodge);

  // 모바일: 누르려는 순간 도망
  noBtn.addEventListener("touchstart", dodge, { passive:false });

  // 클릭: 항복 전에는 도망, 항복 후에는 Yes와 똑같이 영상 재생
  noBtn.addEventListener("click", (e) => {
    if (surrendered) { startVideo(); return; }
    dodge(e);
  });

})();
</script>
</body>
</html>
